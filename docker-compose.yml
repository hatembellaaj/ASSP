services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mouvplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mouvplus}
      POSTGRES_DB: ${POSTGRES_DB:-mouvplus}
    volumes:
      - mouvplus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mouvplus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mouvplus}:${POSTGRES_PASSWORD:-mouvplus}@postgres:5432/${POSTGRES_DB:-mouvplus}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "${BACKEND_PORT:-18401}:4000"
    volumes:
      - mouvplus_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-18400}:80"

volumes:
  mouvplus_pgdata:
  mouvplus_uploads:
